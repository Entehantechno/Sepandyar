services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sepandyar
      POSTGRES_USER: sepandyar
      POSTGRES_PASSWORD: change-me-in-production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepandyar -d sepandyar"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
volumes:
  postgres_data:
  redis_data:
